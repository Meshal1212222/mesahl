<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة التصميم - Monday.com | بدون حدود للحجم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6366F1;
            --secondary: #EC4899;
            --success: #10B981;
            --danger: #EF4444;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle { color: #666; font-size: 1.1rem; margin-bottom: 1.5rem; }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 1rem;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 25px rgba(0,0,0,0.2); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #4F46E5); color: white; }
        .btn-secondary { background: linear-gradient(135deg, var(--secondary), #DB2777); color: white; }
        .btn-success { background: linear-gradient(135deg, var(--success), #059669); color: white; }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #DC2626); color: white; }
        .btn-sm { padding: 0.6rem 1rem; font-size: 0.9rem; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .stat-label { color: #666; font-size: 0.9rem; }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            margin-bottom: 2rem;
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .grid-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: 3px solid transparent;
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .grid-item:hover {
            border-color: var(--secondary);
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3);
        }

        .item-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--secondary), #DB2777);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            margin-bottom: 1rem;
        }

        .item-name {
            font-weight: 700;
            font-size: 1rem;
            color: #1F2937;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .item-meta { font-size: 0.85rem; color: #6B7280; margin-bottom: 1rem; }

        .item-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .item-actions button { flex: 1; min-width: 90px; }

        .empty {
            text-align: center;
            padding: 3rem;
            color: #9CA3AF;
        }

        .empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }

        .image-preview {
            width: 100%;
            height: 180px;
            background: white;
            border-radius: 10px;
            margin-bottom: 1rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #E5E7EB;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .notes-area {
            width: 100%;
            min-height: 150px;
            padding: 1rem;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            resize: vertical;
        }

        .notes-area:focus {
            outline: none;
            border-color: var(--primary);
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .grid { grid-template-columns: 1fr; }
            .actions { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎨 مكتبة التصميم</div>
            <p class="subtitle">Monday.com Design System - بدون حدود للحجم!</p>

            <div class="actions">
                <button class="btn btn-primary" onclick="document.getElementById('pdfUpload').click()">
                    📤 رفع Wireframe (PDF)
                </button>
                <button class="btn btn-secondary" onclick="document.getElementById('imageUpload').click()">
                    🎨 رفع صور الهوية البصرية
                </button>
                <button class="btn btn-danger" onclick="clearAllData()">
                    🗑️ مسح جميع الملفات
                </button>
            </div>

            <input type="file" id="pdfUpload" accept=".pdf" style="display: none;" onchange="uploadPDF(event)">
            <input type="file" id="imageUpload" accept="image/*" multiple style="display: none;" onchange="uploadImages(event)">
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="pdfCount">0</div>
                <div class="stat-label">📄 Wireframes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="imageCount">0</div>
                <div class="stat-label">🎨 صور الهوية</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalSize">0 MB</div>
                <div class="stat-label">💾 الحجم الكلي</div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">📄 Wireframes من Monday.com</h2>
            <div class="grid" id="pdfContainer"></div>
        </div>

        <div class="card">
            <h2 class="card-title">🎨 الهوية البصرية</h2>
            <div class="grid" id="imageContainer"></div>
        </div>

        <div class="card">
            <h2 class="card-title">📝 ملاحظات التصميم</h2>
            <textarea id="notes" class="notes-area" placeholder="اكتب ملاحظاتك هنا..."></textarea>
            <button class="btn btn-success" onclick="saveNotes()" style="margin-top: 1rem; width: 100%;">
                💾 حفظ الملاحظات
            </button>
        </div>
    </div>

    <script src="design-storage.js"></script>
    <script>
        // Upload PDF
        async function uploadPDF(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.type !== 'application/pdf') {
                alert('⚠️ يرجى رفع ملف PDF فقط');
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const fileData = {
                        id: Date.now(),
                        name: file.name,
                        type: 'wireframe',
                        uploadDate: new Date().toISOString(),
                        data: e.target.result,
                        size: file.size
                    };

                    await saveFileDB(fileData);
                    await loadPDFs();
                    await updateStats();
                    alert('✅ تم رفع الملف بنجاح!');
                } catch (error) {
                    console.error('Error:', error);
                    alert('❌ حدث خطأ: ' + error.message);
                }
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // Upload Images
        async function uploadImages(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;

                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const fileData = {
                            id: Date.now() + Math.random(),
                            name: file.name,
                            type: 'brand',
                            uploadDate: new Date().toISOString(),
                            data: e.target.result,
                            size: file.size
                        };

                        await saveFileDB(fileData);
                        await loadImages();
                        await updateStats();
                    } catch (error) {
                        console.error('Error:', error);
                    }
                };
                reader.readAsDataURL(file);
            }

            alert('✅ تم رفع الصور بنجاح!');
            event.target.value = '';
        }

        // Load PDFs
        async function loadPDFs() {
            const container = document.getElementById('pdfContainer');
            const files = await getFilesByType('wireframe');

            if (files.length === 0) {
                container.innerHTML = '<div class="empty"><div class="empty-icon">📄</div><p>لم يتم رفع أي Wireframe بعد</p></div>';
                return;
            }

            container.innerHTML = files.map(file => {
                const date = new Date(file.uploadDate).toLocaleDateString('ar-SA');
                const size = (file.size / (1024 * 1024)).toFixed(2);
                return `
                    <div class="grid-item">
                        <div class="item-icon">📄</div>
                        <div class="item-name">${file.name}</div>
                        <div class="item-meta">📅 ${date}<br>💾 ${size} MB</div>
                        <div class="item-actions">
                            <button class="btn btn-primary btn-sm" onclick="viewPDF(${file.id})">👁️ عرض</button>
                            <button class="btn btn-success btn-sm" onclick="downloadFile(${file.id})">⬇️ تحميل</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteFile(${file.id})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Load Images
        async function loadImages() {
            const container = document.getElementById('imageContainer');
            const files = await getFilesByType('brand');

            if (files.length === 0) {
                container.innerHTML = '<div class="empty"><div class="empty-icon">🎨</div><p>لم يتم رفع أي صورة بعد</p></div>';
                return;
            }

            container.innerHTML = files.map(file => {
                const date = new Date(file.uploadDate).toLocaleDateString('ar-SA');
                const size = (file.size / (1024 * 1024)).toFixed(2);
                return `
                    <div class="grid-item">
                        <div class="image-preview">
                            <img src="${file.data}" alt="${file.name}">
                        </div>
                        <div class="item-name">${file.name}</div>
                        <div class="item-meta">📅 ${date}<br>💾 ${size} MB</div>
                        <div class="item-actions">
                            <button class="btn btn-primary btn-sm" onclick="viewImage(${file.id})">👁️ عرض</button>
                            <button class="btn btn-success btn-sm" onclick="downloadFile(${file.id})">⬇️</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteFile(${file.id})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // View PDF
        async function viewPDF(id) {
            const file = await getFileDB(id);
            if (!file) return;

            const win = window.open('', '_blank');
            win.document.write(`
                <!DOCTYPE html>
                <html dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <title>${file.name}</title>
                    <style>
                        * { margin: 0; padding: 0; }
                        body { background: #f5f5f5; }
                        iframe { width: 100%; height: 100vh; border: none; }
                    </style>
                </head>
                <body>
                    <iframe src="${file.data}"></iframe>
                </body>
                </html>
            `);
        }

        // View Image
        async function viewImage(id) {
            const file = await getFileDB(id);
            if (!file) return;

            const win = window.open('', '_blank');
            win.document.write(`
                <!DOCTYPE html>
                <html dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <title>${file.name}</title>
                    <style>
                        * { margin: 0; padding: 0; }
                        body {
                            background: #000;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            min-height: 100vh;
                        }
                        img { max-width: 90%; max-height: 90vh; }
                    </style>
                </head>
                <body>
                    <img src="${file.data}" alt="${file.name}">
                </body>
                </html>
            `);
        }

        // Download File
        async function downloadFile(id) {
            const file = await getFileDB(id);
            if (!file) return;

            const link = document.createElement('a');
            link.href = file.data;
            link.download = file.name;
            link.click();
        }

        // Delete File
        async function deleteFile(id) {
            if (!confirm('هل أنت متأكد من الحذف؟')) return;

            await deleteFileDB(id);
            await loadPDFs();
            await loadImages();
            await updateStats();
            alert('✅ تم الحذف');
        }

        // Clear All
        async function clearAllData() {
            if (!confirm('⚠️ حذف جميع الملفات؟')) return;

            await clearAllFilesDB();
            await loadPDFs();
            await loadImages();
            await updateStats();
            alert('✅ تم مسح جميع الملفات');
        }

        // Update Stats
        async function updateStats() {
            const stats = await getStorageStats();
            document.getElementById('pdfCount').textContent = stats.wireframeCount;
            document.getElementById('imageCount').textContent = stats.brandImageCount;
            document.getElementById('totalSize').textContent = stats.totalSizeMB + ' MB';
        }

        // Save Notes
        function saveNotes() {
            const notes = document.getElementById('notes').value;
            localStorage.setItem('designNotes', notes);
            alert('✅ تم حفظ الملاحظات');
        }

        // Load Notes
        function loadNotes() {
            const notes = localStorage.getItem('designNotes') || '';
            document.getElementById('notes').value = notes;
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', async () => {
            await loadPDFs();
            await loadImages();
            await updateStats();
            loadNotes();
        });
    </script>
</body>
</html>
